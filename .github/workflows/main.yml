name: Master Build MySecretary APK (v6 - AutoFix)
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Create Missing Root Files (Auto-Fix)
        run: |
          # إنشاء ملف settings.gradle إذا لم يكن موجوداً
          if [ ! -f settings.gradle ]; then
            echo "include ':app'" > settings.gradle
            echo "rootProject.name = 'MySecretary'" >> settings.gradle
          fi

          # إنشاء ملف build.gradle الرئيسي (الخريطة)
          cat <<EOF > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # إنشاء ملفات Gradle Wrapper
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi

      - name: 4. Set Permissions
        run: chmod +x gradlew

      - name: 5. Build APK
        run: ./gradlew assembleDebug

      - name: 6. Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: MySecretary-Ready-APK
          path: "**/build/outputs/apk/debug/*.apk"
