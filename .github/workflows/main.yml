name: Master Build MySecretary APK (v5)
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Generate Missing Build Files
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi

      - name: 4. Set Permissions
        run: chmod +x gradlew

      - name: 5. Build APK
        run: ./gradlew assembleDebug

      - name: 6. Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: MySecretary-Ready-APK
          path: "**/build/outputs/apk/debug/*.apk"
