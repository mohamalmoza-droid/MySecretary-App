name: MySecretary Zero-Failure Build (v10.7)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Nuclear Project Reconstruction (The "Out of Box" Fix)
        run: |
          # إنشاء هيكل المجلدات بالكامل
          mkdir -p app/src/main/java/com/mysecretary/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/assets

          # إنشاء ملف Manifest الأساسي
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.xml/apk/res/android" package="com.mysecretary.app">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="MySecretary" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # إنشاء ملف القيم الأساسي
          echo '<resources><string name="app_name">MySecretary</string></resources>' > app/src/main/res/values/strings.xml
          echo '<resources><style name="Theme.MySecretary" parent="Theme.AppCompat.Light.NoActionBar"/></resources>' > app/src/main/res/values/themes.xml

          # نقل ملفات الـ HTML إلى Assets
          cp -f *.html app/src/main/assets/ || true

          # إنشاء ملف MainActivity.kt لضمان وجود كود برمجي للتشغيل
          cat <<EOF > app/src/main/java/com/mysecretary/app/MainActivity.kt
          package com.mysecretary.app
          import android.os.Bundle
          import android.webkit.WebView
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val webView = WebView(this)
                  webView.settings.javaScriptEnabled = true
                  webView.loadUrl("file:///android_asset/index.html")
                  setContentView(webView)
              }
          }
          EOF

      - name: 4. Build Setup
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: 5. Execute Build
        run: ./gradlew assembleDebug --no-daemon

      - name: 6. Deliver APK
        uses: actions/upload-artifact@v4
        with:
          name: MySecretary-V10.7-Final-APK
          path: "app/build/outputs/apk/debug/*.apk"
