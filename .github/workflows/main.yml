name: MySecretary Ultimate Build (v10.5 - Final Fix)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Force Stable Gradle 8.2
        run: |
          # نستخدم إصداراً مستقراً لضمان التوافق وتجنب مشاكل الإصدارات الحديثة جداً
          gradle wrapper --gradle-version 8.2 --distribution-type all
          chmod +x gradlew

      - name: 4. Build Debug APK
        run: |
          # بناء التطبيق مع تفعيل وضع تصحيح الأخطاء المفصل
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 5. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MySecretary-Final-APK
          path: "app/build/outputs/apk/debug/*.apk"
