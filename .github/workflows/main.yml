# كود بناء تطبيق MySecretary (APK)

```yaml
name: Build MySecretary APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v3

      - name: 2. Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: 3. Generate Gradle Wrapper
        run: gradle wrapper

      - name: 4. Set Permissions
        run: chmod +x gradlew

      - name: 5. Build APK
        run: ./gradlew assembleDebug

      - name: 6. Upload Finished APK
        uses: actions/upload-artifact@v3
        with:
          name: MySecretary-Download-APK
          path: "**/build/outputs/apk/debug/*.apk"
```
