name: MySecretary Ultimate Build (v10.1 - Stable)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Force Gradle 8.2 Wrapper
        run: |
          gradle wrapper --gradle-version 8.2 --distribution-type all

      - name: 4. Permissions and Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 5. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MySecretary-Stable-APK
          path: "app/build/outputs/apk/debug/*.apk"
