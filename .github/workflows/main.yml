name: MySecretary Ultimate Build (v10 - Fixed)
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Force Stable Gradle Wrapper
        run: |
          # نستخدم الإصدار 8.2 لضمان التوافق التام مع مكتبات الأندرويد الحالية
          gradle wrapper --gradle-version 8.2 --distribution-type all

      - name: 4. Reconstruct Project Files (Safety Net)
        run: |
          # إعادة إنشاء ملفات الإعدادات لضمان عدم وجود أخطاء في المسارات أو التسمية
          echo "include ':app'" > settings.gradle
          echo "rootProject.name = 'MySecretary'" >> settings.gradle
          
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          mkdir -p app

      - name: 5. Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 6. Archive APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MySecretary-Final-APK
          path: "app/build/outputs/apk/debug/*.apk"
