name: Master Build MySecretary APK (v9 - Compatibility Fix)
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Gradle Wrapper (Fix Compatibility)
        run: |
          # سنقوم بتثبيت إصدار Gradle 8.2 المستقر لتجنب مشاكل الإصدار 9.6
          gradle wrapper --gradle-version 8.2 --distribution-type all

      - name: 4. Initialize Project Structure
        run: |
          # إنشاء الملفات الأساسية لضمان عدم وجود أخطاء في المسارات
          echo "include ':app'" > settings.gradle
          echo "rootProject.name = 'MySecretary'" >> settings.gradle
          
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          mkdir -p app

      - name: 5. Build APK with Wrapper
        run: |
          # استخدام ./gradlew بدلاً من gradle لضمان استخدام الإصدار 8.2 الذي قمنا بتثبيته
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 6. Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: MySecretary-Ready-APK
          path: "**/build/outputs/apk/debug/*.apk"
