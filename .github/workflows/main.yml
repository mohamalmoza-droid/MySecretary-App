name: Master Build MySecretary APK (v8 - Gradle 9.6.1 Support)
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Initialize Android Project Structure (Auto-Fix)
        run: |
          # إنشاء ملف settings.gradle
          echo "include ':app'" > settings.gradle
          echo "rootProject.name = 'MySecretary'" >> settings.gradle

          # إنشاء ملف build.gradle الرئيسي متوافق مع Gradle 9.x
          cat <<EOF > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # التأكد من وجود مجلد app
          mkdir -p app

      - name: 4. Build APK with Gradle 9.6.1
        run: |
          # استخدام خيار --non-interactive الجديد في Gradle 9.6.1 لمنع التعليق في بيئة CI
          gradle assembleDebug --non-interactive --no-daemon

      - name: 5. Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: MySecretary-Ready-APK
          path: "**/build/outputs/apk/debug/*.apk"
