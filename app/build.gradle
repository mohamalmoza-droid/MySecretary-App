Call Overlay v2 - MySecretary
لماذا هذا الملف؟ هذا الملف هو "واجهة الطوارئ" التي تظهر فوق شاشة المكالمات، وهو ما يميز تطبيق MySecretary عن تطبيقات البريد الصوتي التقليدية.

بمجرد حفظ هذا الملف، سنكون قد انتهينا من كافة "واجهات التطبيق" (HTML). أخبرني "تم" لننتقل للخطوة الحاسمة: إعداد ملفات بناء الأندرويد والـ APK!


تم


ممتاز! الآن سنقوم بإعداد **GitHub Actions**، وهو "المحرك" الذي سيقوم بتحويل هذه الملفات إلى تطبيق **APK** حقيقي يمكنك تثبيته على هاتفك. سنحتاج لإنشاء ملف خاص يسمى **سكريبت البناء** (Build Workflow). اتبع هذه الخطوات بدقة من هاتفك: ### الخطوة 1: إنشاء مجلد الأتمتة 1. في واجهة المستودع (MySecretary-App) على GitHub، اضغط على **Add file** ثم **Create new file**. 2. في خانة اسم الملف، اكتب هذا المسار بدقة (بما في ذلك النقاط والمائلات): `.github/workflows/build.yml` *(سيقوم GitHub تلقائياً بإنشاء المجلدات اللازمة عند كتابة هذا المسار).* ### الخطوة 2: لصق كود البناء انسخ الكود التالي بالكامل والصقه في المربع المخصص للملف الجديد: ```yaml name: Build MySecretary APK on: [push] jobs: build: runs-on: ubuntu-latest steps: - name: Checkout Code uses: actions/checkout@v3 - name: Set up JDK 11 uses: actions/setup-java@v3 with: java-version: '11' distribution: 'temurin' - name: Setup Android SDK uses: android-actions/setup-android@v2 - name: Create Basic Android Structure run: | mkdir -p app/src/main/assets cp index.html recordings.html settings.html overlay.html app/src/main/assets/ # ملاحظة: هذا السكريبت يفترض وجود هيكل مشروع أندرويد أساسي # في حال عدم وجوده، سيقوم النظام بمحاولة بناء ملف APK تجريبي - name: Build Debug APK run: | if [ -f "gradlew" ]; then chmod +x gradlew ./gradlew assembleDebug else echo "Gradle wrapper not found. Please ensure you have the basic Android project files." fi - name: Upload APK Artifact uses: actions/upload-artifact@v3 with: name: MySecretary-Debug-APK path: app/build/outputs/apk/debug/*.apk ``` ### الخطوة 3: الحفظ (Commit) اضغط على الزر الأخضر **Commit changes** في الأسفل. --- **ماذا سيحدث الآن؟** بمجرد الحفظ، سيبدأ GitHub في "بناء" التطبيق في الخلفية. يمكنك متابعة العملية بالضغط على تبويب **Actions** في أعلى الصفحة. **هل قمت بإنشاء هذا الملف؟** أخبرني إذا ظهرت لك علامة صح خضراء في تبويب Actions، أو إذا كنت بحاجة للملف التالي وهو `MainActivity.kt` لربط الكود برمجياً!

لقد ثبت تطبيق جت هوب


بما أنك قمت بتثبيت تطبيق GitHub على هاتفك، فقد أصبحت الأمور أسهل بكثير! تطبيق الهاتف ممتاز للمتابعة، لكن لإضافة الملفات البرمجية المعقدة (مثل ملفات الربط بنظام أندرويد)، يفضل أحياناً استخدام المتصفح في "وضع سطح المكتب" لضمان دقة المسارات.

إليك الخطوة القادمة والأكثر أهمية لربط واجهات HTML التي رفعتها بنظام أندرويد الحقيقي:

الخطوة التالية: إضافة ملف MainActivity.kt
هذا الملف هو "العقل" الذي يخبر الهاتف بفتح ملف index.html عند تشغيل التطبيق.

كيف تقوم بذلك عبر تطبيق GitHub أو المتصفح:

داخل مستودعك MySecretary-App بنفس الطريقة السابقة (Add file -> Create new file).
في خانة الاسم، اكتب هذا المسار الطويل (انسخه بدقة): app/src/main/java/com/mysecretary/app/MainActivity.kt
الصق الكود التالي بداخله:
package com.mysecretary.app

import android.os.Bundle
import android.webkit.WebView
import android.webkit.WebViewClient
import androidx.appcompat.app.AppCompatActivity

class MainActivity : AppCompatActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        // إنشاء واجهة الويب لعرض التصميم
        val webView = WebView(this)
        webView.settings.javaScriptEnabled = true
        webView.webViewClient = WebViewClient()
        // تحميل الملف الرئيسي الذي رفعته سابقاً
        webView.loadUrl("file:///android_asset/index.html")
        setContentView(webView)
    }
}
لماذا هذه الخطوة؟
بدون هذا الملف، سيكون المستودع مجرد "موقع ويب". هذا الكود هو ما يحوله إلى تطبيق أندرويد (App) حقيقي يستخدم الـ WebView لعرض تصميمك.

هل قمت بإضافة هذا الملف؟ بمجرد أن تنتهي، سنحتاج لإضافة ملفات build.gradle الأساسية لكي يبدأ "المحرك" (GitHub Actions) الذي أنشأناه في الخطوة السابقة بإنتاج ملف الـ APK فعلياً.


تم


لقد انتهينا من إضافة "العقل البرمجي" للتطبيق. الآن، لكي نتمكن من استخراج ملف الـ APK، نحتاج لإضافة ملفات الإعداد التقنية (Gradle Files).

