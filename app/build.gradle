إضافة ملف build.gradle للمشروع
هذا الملف هو المسؤول عن تعريف "إصدار الأندرويد" والمكتبات المستخدمة.

الخطوات:

في مستودعك MySecretary-App على GitHub، اضغط على Add file ثم Create new file.
في خانة الاسم، اكتب بدقة: app/build.gradle.
الصق الكود التالي بالكامل:
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 29
    defaultConfig {
        applicationId "com.mysecretary.app"
        minSdkVersion 21
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.5.31"
    implementation 'androidx.core:core-ktx:1.6.0'
    implementation 'androidx.appcompat:appcompat:1.3.1'
}
