في الموجات الصوتية (Waveforms) إضافة تمثيل بصري للموجات الصوتية داخل المشغل لتسهيل التنقل البصري بحيث يمكن سحب الموجه لتقديم او تاخير المقطع الصوتي والتنقل فيه.


تم تحديث شاشة التسجيلات لتصبح الموجات الصوتية تفاعلية بالكامل.

ما تم إضافته:
التنقل بالسحب (Seekable Waveform): يمكنك الآن الضغط والسحب على الموجة الصوتية في المشغل السفلي للتقديم أو التأخير في التسجيل.
مؤشر زمن ذكي (Time Tooltip): يظهر تلميح زمني صغير فوق الموجة عند التحريك أو السحب ليوضح لك التوقيت المختار بدقة.
تغذية راجعة بصرية: تتغير ألوان أعمدة الموجة الصوتية تلقائياً لتعكس التقدم الحالي في المقطع الصوتي، مع وجود خط مؤشر (Playhead) يتحرك بسلاسة.
تزامن الوقت: يتم تحديث العداد الزمني (00:00 / 58:12) لحظياً أثناء التفاعل مع الموجة.
يمكنك الآن اختبار هذه الميزة مباشرة في التصميم. هل تود إضافة نفس التفاعلية لأي شاشات أخرى أو تعديل سرعة الاستجابة؟


