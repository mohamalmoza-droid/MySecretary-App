name: Master Build MySecretary APK (v7 - Fixed Structure)
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Initialize Android Project Structure
        run: |
          # 1. إنشاء ملف settings.gradle في الجذر
          echo "include ':app'" > settings.gradle
          echo "rootProject.name = 'MySecretary'" >> settings.gradle

          # 2. إنشاء ملف build.gradle الرئيسي في الجذر
          cat <<EOF > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 3. التأكد من وجود مجلد app وملف build.gradle داخله
          # ملاحظة: إذا كان الملف موجوداً بالفعل في المستودع سيتم استخدامه،
          # ولكن هذا الأمر يضمن عدم فشل البناء بسبب فقدان الهيكلية.
          mkdir -p app

      - name: 4. Build APK
        run: |
          # استخدام gradle المثبت في نظام ubuntu-latest لبناء المشروع مباشرة
          # وتجاوز مشكلة فقدان ملف gradlew المحلي
          gradle assembleDebug

      - name: 5. Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: MySecretary-Ready-APK
          path: "**/build/outputs/apk/debug/*.apk"
