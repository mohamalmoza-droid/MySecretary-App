تعديل ألوان الموجات الصوتية


تم تحديث ألوان الموجات الصوتية (Waveforms) في شاشة التسجيلات بنجاح.

التعديلات التي تمت:

وضوح التقدّم: تحويل لون الأجزاء التي تم تشغيلها إلى اللون الكحلي الأساسي (Primary Indigo) لزيادة الوضوح.
التباين البصري: جعل الأجزاء المتبقية من الموجة أكثر شفافية لتمييزها بوضوح عن الجزء المشغل.
تحديث مؤشر التشغيل: تحسين مظهر خط مؤشر التشغيل (Playhead) ليتناسب مع الهوية البصرية الاحترافية للتطبيق.
هذه التعديلات تجعل التنقل البصري داخل المقاطع الصوتية أسهل وأكثر راحة للعين. هل تود تطبيق هذه الألوان على نسخة "الوضع الداكن" أيضاً؟


