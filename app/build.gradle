Generate an image of ابدا با نشاء وببرمجة تطبيق أندرويد بلغة Kotlin مستهدفاً Android 10 (API 29) يسمى -MySecretary سكرتيري الخاص. يتكون من Foreground Service تعتمد على TelephonyManager لاستشعار المكالمات، وWindowManager لعرض واجهة أزرار عائمة Overlay Blocking. يعتمد التطبيق محلياً على إيقاف مجريات الانتظار Collision Handling (Abort Existing Task) عند ضغط الزر الفوري، مع كتم الصوت Mic Mute افتراضياً، وتلقي صوت المتصل عبر Record Audio وحفظه في الذاكرة الداخلية بصيغة MP3، مع توفير واجهة Dashboard ومشغل صوت متتالي وإعدادات فلترة شاملة." وبحسب الوصف التالي:

المخطط الهندسي الكامل لتطبيق "MySecretary سكرتيري الخاص"​1. الهوية والهدف العام (App Identity & Core Objective)​اسم التطبيق :-MySecretary سكرتيري الخاص. الهدف العام: تحويل الهاتف الذكي إلى جهاز بريد صوتي محلي (Offline Voicemail) يعمل على الجهاز مباشرة دون الحاجة لسيرفرات خارجية أو اتصال بالإنترنت. ​الفلسفة البرمجية: تزويد المستخدم بتحكم تفاعلي مرن أثناء ورود المكالمات لرفع مستوى الخصوصية وإدارة التسجيلات بسلاسة.

​2. معلومات ونظام جهازك (Target Environment & Device Specs) ​نوع الجهاز ونظامه: Samsung Android 10 (Q) (API Level 29).​لغة البرمجة والتطوير: Kotlin (باستخدام Coroutines و Flow للتعامل مع العمليات الخلفية متزامنة الأداء).​بيئة التطوير والتوافق: يتم ضبط البنية البرمجية خصيصاً لتتوافق مع Android 10 لحل قيود تسجيل المكالمات وقيود Speakerphone و Take Call الموجودة في الإصدارات الأحدث. ​مستوى الصلاحيات (Core Permissions Required): ​ANSWER_PHONE_CALLS / MODIFY_PHONE_STATE: للرد الآلي وتلقي المكالمات.​RECORD_AUDIO: لتسجيل الصوت الوارد من المتصل. ​MODIFY_AUDIO_SETTINGS: لكتم الميكروفون وتفعيل مكبر الصوت.​SYSTEM_ALERT_WINDOW: لعرض الأزرار والشاشات العائمة (Overlay / Blocking Overlay). ​READ_CONTACTS: لجلب أسماء المتصلين وتطبيق سياسات الفلترة. / ​READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE: لإدارة وقراءة ملفات الصوت والتسجيلات. ​FOREGROUND_SERVICE: لضمان عمل الخدمة الخلفية كـ Sticky Service دون إغلاقها من النظام.​3. البنية المنطقية لتدفق المكالمات والتفاعل (Complete Logic Flow).

​يتكون مسار العمل عند استقبال كل مكالمة من أربع مراحل إجرائية متتالية:

​🟢 المرحلة الأولى: الاستجابة والرصد (Call Detection & Overlay Setup) ​استشعار المكالمة: تقوم خدمة خلفية مستمرة (Foreground Sticky Service) برصد حالة الهاتف عند استلام مكالمة واردة جديدة. ​تطبيق قواعد الفلترة: يفحص النظام رقم المتصل للتأكد من انطباق شروط الفلترة المحددة ( لجميع المكالمات، أرقام جهات الاتصال محدده ، أو الأرقام المجهولة).​عرض الزر العائم: بعد انطباق الشرط على المكالمه الوارده تظهر زرار عائم يحتوي على زر مكتوب عليه "تحويل إلى البريد الصوتي" باستخدام خاصية Overlay, Blocking لضمان إمكانية التفاعل معه حتى فوق شاشة القفل.​بدء العداد الزمني: يبدأ عداد الانتظار التلقائي في الخلفية بناءً على المدة التي حددها المستخدم (ما بين 1 إلى 60 ثانية). ​🟡 المرحلة الثانية: التحويل والرد الآلي (Handshake & Playback) ​آلية تشغيل الرد: يتم التحويل والانتقال للرد الآلي فور حدوث أحد الأمرين:​التحويل اليدوي: الضغط من قبل المستخدم مباشرة على زر (التحويل الى البريد الصوتي) العائم. ​التحويل التلقائي: انتهاء مهلة العداد الزمني المحدد بدون تدخل. ​إلغاء الانتظار الفوري (Collision Handling): إذا قمت بضغط الزر يدوياً، يقوم التطبيق بتنفيذ آلية إجهاض مهلة الانتضار الحالية لتخطي الوقت المتبقي في العداد الزمني والانتقال مباشرة إلى فتح الخط بدون تأخير.​فتح الخط وإدراج الصوت: ​يتم فتح الخط برمجياً عبر أمر Take Call.

تدمير الزر الأول: فور بدء عملية الرد، يتم إخفاء زر "تحويل إلى البريد الصوتي" وتدمير واجهته (Destroy Scene).​يتم تفعيل كتم الميكروفون تلقائياً (Mic Mute = ON) لمنع المتصل من سماع أثر الضوضاء أو صوت المستخدم افتراضياً. ​يتم بث مقطع الرسالة الترحيبية المسجلة مسبقاً في خط المكالمة مع إلحاق صوت "الصفارة" عند نهايته. ​🔴 المرحلة الثالثة: التسجيل والتحكم الحي (In-Call Recording & Live Controls)​بدء تسجيل المكالمة: تبدأ عملية تسجيل صوت المتصل تلقائياً (Record Audio) فور انتهاء بث المقطع الترحيبي والصفارة. ​عزل وخفض الوسائط (Audio Focus): يتم خفض أصوات التطبيقات والوسائط الأخرى تلقائياً أثناء التسجيل لضمان نقاء الصوت الوارد.​المرحلة الرابعة: الإنهاء والتخزين (Completion & Storage)​إنهاء المراقبة: يتم إنهاء عملية التسجيل فور غلق المكالمة من قِبل المتصل أو المستقبل، وتدمير كافة الأزرار العائمة. ​الحفظ المحلي: يُحفظ الملف الصوتي تلقائياً في مجلد التطبيق المخصص داخل الذاكرة الداخلية بصيغة صوتية محددة مع تضمين بيانات الرقم، الاسم، التاريخ، والوقت. ​4. هيكلية واجهات المستخدم (UI & UX Architecture) ​أ. الشاشة الرئيسية (Dashboard) ​زر التفعيل العام (Master Toggle Switch): زر رئيسي أعلى الشاشة لتفعيل أو إيقاف الخدمة كلياً.​بطاقات إحصائية متطورة (Analytics Cards): ​عدد الرسائل الصوتية غير المسموعة. ​إجمالي التسجيلات المحفوظة والمساحة المستهلكة. ​ب. مدير التسجيلات المحلي (Recording Manager) ​القائمة الذكية (Smart List): عرض التسجيلات مصفوفة من الأحدث إلى الأقدم وتتضمن: ​اسم المتصل (إذا كان مسجلاً في جهات الاتصال) أو الرقم. ​التاريخ، الوقت، ومدة التسجيل الصوتي.​المشغل الذكي (Smart Player): ​مشغل داخلي متطور يدعم التقديم والترجيع وإيقاف الصوت. ​دعم التشغيل المتتالي (Sequential Playback) للتنقل للمقطع التالي تلقائياً. ​خيار تسريع الصوت (1.25x / 1.5x / 2.0x). ​إدارة الملفات: إمكانية مشاركة الملفات (WhatsApp, Bluetooth... إلخ)، مع امكانيةإعادت تسميتها، أو حذفها. ​ج. لوحة الإعدادات المتقدمة (Settings Panel)​مهلة التحويل التلقائي: إمكانية تخصيص وتحديد المدة الزمنية للعداد التنازلي قبل الرد الآلي في مجال يتراوح بين 1 إلى 60 ثانية. ​المقطع الترحيبي: خيار لاختيار وتحديد ملف صوتي مخصص من ذاكرة الهاتف مع إمكانية استماعه ومعاينته مسبقاً. ​قواعد فلترة المكالمات: خيارات لتطبيق نظام المجيب الآلي على فئات محددة تشمل: (جميع المكالمات الواردة، جهات الاتصال المسجلة فقط، أو الأرقام المجهولة وغير المسجلة فقط). ​جودة وصيغة الملف الصوتي: إمكانية المفاضلة والاختيار بين صيغة MP3 (لتوفير مساحة التخزين بحجم صغير) أو صيغة WAV (للحصول على أعلى جودة صوتية).​الأمان والخصوصية: خيار اختياري لتأمين وقفل شاشة إدارة التسجيلات الصوتية بكلمة مرور أو عبر بصمة الأصبع. ​إدارة التخزين الذكية: ميزة التجميع والتنظيف التلقائي للتسجيلات، والتي تقوم بحذف التسجيلات القديمة تلقائياً عند الاقتراب من امتلاء مساحة الذاكرة المخصصة.​5. الميزات الاحترافية والقيمة المضافة (Value-Added Features).​العمل بدون إنترنت (100% Offline): الحفاظ الكامل على بيانات وصوتيات المستخدم دون أي اتصال خارجي.​التصنيف التلقائي الذكي: وضع علامة "مهم" تلقائياً على التسجيلات الواردة من الأرقام الكثيرة أو متكررة الاتصال. ​وضع توفير الطاقة (Battery Friendly): الاعتماد على الأحداث (Event-Driven Design) بحيث تظل الخدمة خاملة ولا تستهلك موارد المعالج أو البطارية إلا أثناء ورود المكالمات. استقرار الخدمة على أندرويد 10: ضبط إعدادات النظام لتعمل الخدمة كـ Sticky Foreground Service تمنع نظام سامسونج/أندرويد من قتل التطبيق في الخلفية.


I've designed the "MySecretary" (سكرتيري الخاص) app, a professional local voicemail solution tailored for Android 10.

Design Overview
Executive Utility System: I established a visual language using a deep Navy Blue (#1A237E) and Slate Gray palette to convey reliability and privacy.
Dashboard (Dashboard - MySecretary): Features a master toggle for the foreground service, real-time storage analytics, and a quick summary of unheard messages.
Recording Manager (Recordings - MySecretary): A smart list for local recordings with a persistent mini-player, variable speed controls (1.5x), and sequential playback capability.
Settings Panel (Settings - MySecretary): Extensive controls for auto-answer delays (1-60s), audio format selection (MP3/WAV), and smart storage cleanup.
Call Overlay (Call Overlay - MySecretary): A high-contrast blocking overlay designed to appear during incoming calls, featuring the "Transfer to Voicemail" manual override.
The app is designed to work entirely offline, ensuring 100% privacy for your recordings and configuration.

