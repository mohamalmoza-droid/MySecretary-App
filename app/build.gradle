 - name: Upload APK uses: actions/upload-artifact@v2 with: name: MySecretary-Debug-APK path: app/build/outputs/apk/debug/app-debug.apk ``` 4. اضغط على **"Start commit"** ثم **"Commit new file"**. **ماذا تفعل الآن؟** انتظر دقيقتين، ثم اذهب إلى تبويب **Actions** مرة أخرى. ستجد عملية بناء جارية (باللون الأصفر). بمجرد تحولها للون الأخضر، اضغط عليها وستجد ملف الـ **APK** جاهزاً للتحميل في أسفل الصفحة تحت مسمى **Artifacts**. هل واجهت أي صعوبة في كتابة المسارات، أم ننتقل لتجهيز **أيقونة التطبيق** بشكل احترافي؟

